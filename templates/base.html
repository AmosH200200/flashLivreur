<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Flash Livreur {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="#" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "orange-primary": "#FF6B35",
              "orange-secondary": "#FF8C42",
              "orange-light": "#FFB366",
              "orange-dark": "#E85A2B",

              "primary-orange": "#f97316",
              "light-orange": "#fed7aa",
              "dark-orange": "#ea580c",

              orange: {
                50: "#fff7ed",
                100: "#ffedd5",
                200: "#fed7aa",
                300: "#fdba74",
                400: "#fb923c",
                500: "#f97316",
                600: "#ea580c",
                700: "#c2410c",
                800: "#9a3412",
                900: "#7c2d12",
              },
            },
          },
        },
      };
    </script>

    <style>

      /* Style pour partenaire.html */
              .bg-hero {
                  background-image: linear-gradient(135deg, #f97316, #ec6e13),
                                    url("data:image/svg+xml,%3Csvg width='400' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='business-pattern' x='0' y='0' width='100' height='100' patternUnits='userSpaceOnUse'%3E%3Crect width='100' height='100' fill='%23f97316'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23ea580c'/%3E%3Ccircle cx='80' cy='30' r='1.5' fill='%23fb923c'/%3E%3Ccircle cx='50' cy='70' r='1' fill='%23fdba74'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='400' height='300' fill='url(%23business-pattern)'/%3E%3Cg transform='translate(100,50)'%3E%3C!-- Silhouette livreur --%3E%3Cellipse cx='50' cy='200' rx='15' ry='8' fill='%23ffffff' opacity='0.3'/%3E%3Crect x='45' y='180' width='10' height='20' rx='2' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='50' cy='170' r='8' fill='%23ffffff' opacity='0.7'/%3E%3Crect x='42' y='175' width='16' height='10' rx='2' fill='%23ffffff' opacity='0.6'/%3E%3C!-- Silhouette CEO --%3E%3Cellipse cx='150' cy='200' rx='15' ry='8' fill='%23ffffff' opacity='0.3'/%3E%3Crect x='145' y='180' width='10' height='20' rx='2' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='150' cy='170' r='8' fill='%23ffffff' opacity='0.7'/%3E%3Crect x='142' y='175' width='16' height='12' rx='2' fill='%23ffffff' opacity='0.6'/%3E%3C!-- Poignée de main symbolique --%3E%3Cpath d='M65 185 Q100 180 135 185' stroke='%23ffffff' stroke-width='3' fill='none' opacity='0.8'/%3E%3C/g%3E%3C/svg%3E");
                  background-size: cover;
                  background-position: center;
                  backdrop-filter: blur(2px);
              }

              .form-container {
                  backdrop-filter: blur(10px);
                  background: rgba(255, 255, 255, 0.95);
              }

              .input-focus:focus {
                  border-color: #f97316;
                  box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
              }

              .checkbox-custom:checked {
                  background-color: #f97316;
                  border-color: #f97316;
              }

              .partner-description {
                  animation: fadeInUp 0.3s ease-out;
              }

              @keyframes fadeInUp {
                  from {
                      opacity: 0;
                      transform: translateY(10px);
                  }
                  to {
                      opacity: 1;
                      transform: translateY(0);
                  }
              }

               /* Style pour le scroll fluide    */

              html {
                  scroll-behavior: smooth;
              }

              /* Icônes des items */
              .menu-icon {
                  width: 16px;
                  height: 16px;
                  margin-right: 12px;
                  fill: currentColor;
              }

              input, textarea {
              caret-color: orange;
              border: 2px solid #ccc;
              padding: 8px;
              font-size: 16px;
              }

                      .carousel-item {
                  position: absolute;
                  width: 100%;
                  opacity: 0;
                  transform: translateX(100%);
                  transition: none;
              }
              .carousel-item.active {
                  position: relative;
                  opacity: 1;
                  transform: translateX(0);
                  animation: slideInFromRight 0.8s ease-out;
              }
              .carousel-item.exit {
                  animation: slideOutToLeft 0.8s ease-out;
              }
              @keyframes slideInFromRight {
                  from {
                      opacity: 0;
                      transform: translateX(100%);
                  }
                  to {
                      opacity: 1;
                      transform: translateX(0);
                  }
              }
              @keyframes slideOutToLeft {
                  from {
                      opacity: 1;
                      transform: translateX(0);
                  }
                  to {
                      opacity: 0;
                      transform: translateX(-100%);
                  }
              }
              .dot {
                  transition: all 0.3s ease;
              }
              .dot.active {
                  width: 2rem;
              }

                      @keyframes fadeInUp {
                  from {
                      opacity: 0;
                      transform: translateY(30px);
                  }
                  to {
                      opacity: 1;
                      transform: translateY(0);
                  }
              }

              .step-card {
                  animation: fadeInUp 0.6s ease-out forwards;
                  opacity: 0;
              }

              .step-card:nth-child(1) { animation-delay: 0.1s; }
              .step-card:nth-child(2) { animation-delay: 0.3s; }
              .step-card:nth-child(3) { animation-delay: 0.5s; }

              .step-number {
                  transition: all 0.3s ease;
              }

              .step-card:hover .step-number {
                  transform: scale(1.1);
                  background: linear-gradient(135deg, #1f2937 0%, #000 100%);
              }

              .step-card:hover {
                  transform: translateY(-8px);
                  transition: transform 0.3s ease;
              }
        .typewriter {
          font-size: 28px;
          font-weight: 600;
          font-family: sans-serif;
          white-space: nowrap;
          overflow: hidden;
          border-right: 3px solid white; /* le curseur */
          width: fit-content;
          animation: blink 0.7s infinite;
        }

        @keyframes blink {
          50% { border-color: transparent; }
        }        <!-- Curseur machine à écrire >
    </style>
  </head>

  <body class="bg-gray-50" style="font-family: &quot;Helvetica Neue&quot;, Arial, sans-serif">
    {% include 'includes/header.html' %}

    <main>
      {% block content %}
      {% endblock %}
    </main>

    {% include 'includes/footer.html' %}
  </body>
</html>
