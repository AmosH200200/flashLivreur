<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super_admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-zinc-900 rounded-2xl p-8 shadow-2xl border border-zinc-800">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white mb-2">Super admin</h1>
                <p class="text-zinc-400 text-sm"> Connectez-vous à votre tabeau de bord</p>
            </div>


            <!-- Form -->
            <form id="loginForm" method="POST" action="{% url 'super_admin_login' %}" class="space-y-5">
                 {% csrf_token %}
                <!-- Email Input -->
                <div>
                    <input 
                        type="email" 
                        id="email"
                        name="username"
                        value="{{ form.email.value|default:'' }}"
                        placeholder="Email"
                        class="w-full px-4 py-3.5 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20 transition-all"
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="relative">
                    <input 
                        type="password" 
                        name="password"
                        id="password"
                        placeholder="Mot de passe"
                        class="w-full px-4 py-3.5 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20 transition-all pr-12"
                        required
                    >

                    <button 
                        type="button"
                        id="togglePassword"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white transition-colors"
                    >
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-zinc-400 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded bg-zinc-800 border-zinc-700 text-zinc-500 focus:ring-zinc-500 focus:ring-offset-0 cursor-pointer">
                        <span class="ml-2">Se souvenir</span>
                    </label>
                    <a href="#" class="text-zinc-400 hover:text-white transition-colors">Mot de passe oublié?</a>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    class="w-full py-3.5 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
                >
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');
        const loginForm = document.getElementById('loginForm');

        // Toggle password visibility
        toggleButton.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            
            eyeIcon.classList.toggle('hidden');
            eyeSlashIcon.classList.toggle('hidden');
        });


    </script>
</body>
</html>
