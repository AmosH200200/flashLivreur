<!-- Modal unique de confirmation de désactivation -->
<div
  id="desactivateModal"
  class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center"
>
  <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4">
    <div class="text-center">
      <div
        class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4"
      >
        <i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
      </div>
      <h3 id="desactivateModalTitle" class="text-lg font-bold text-gray-900 mb-2">
        Confirmer la désactivation
      </h3>
      <p id="desactivateModalText" class="text-sm text-gray-500 mb-6">
        Êtes-vous sûr de vouloir désactiver cet utilisateur ? Cette action peut être
        annulée ultérieurement.
      </p>
      <div class="flex gap-3">
        <button
          onclick="closeDesactivateModal()"
          class="flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg transition"
        >
          Annuler
        </button>
        <button
          id="confirmDesactivateBtn"
          onclick="desactivateUser()"
          class="flex-1 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition"
        >
          Bloquer
        </button>
      </div>
    </div>
  </div>
</div>
