  <!--FORMULAIRE D'AJOUT USER--> 
   
   <form id="adminForm" class="space-y-4" method="POST" action="{% url 'add_client' %}">
                {% csrf_token %}
                <!-- Ligne 1: Nom et Prénom -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">Nom *</label>
                        <input
                        value="{{ form.last_name.value|default:'' }}" 
                        type="text" name="last_name" id="lastName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="Jack">
                    </div>
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">Prénom *</label>
                        <input 
                        value="{{ form.first_name.value|default:'' }}"
                        type="text" name="first_name" id="firstName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="Jean">
                    </div>
                </div>

                <!-- Ligne 2: Email et Téléphone -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                        <input
                        value="{{ form.email.value|default:'' }}" 
                        type="email" name="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="exmemple@gmail.com">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Téléphone *</label>
                        <input
                        value="{{ form.telephone.value|default:'' }}" 
                        type="tel" name="telephone" id="phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="+229 XX XX XX XX">
                    </div>
                </div>

                <!-- Ligne 4: Rôle -->
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-2">Rôle *</label>
                    <select 
                    value="{{ form.user_type.value|default:'' }}"
                    name="user_type" id="role" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                        <option value="">Sélectionner un rôle</option>
                        <option value="admin">Admin</option>
            s           <option value="auper_admin">Super Admin</option>
                        <option value="livreur">Livreur</option>
                        <option value="commercial">Commercial</option>
                        <option value="client">Client</option>
                    </select>
                </div>

                <!-- Message d'erreur -->
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg"></div>

                <!-- Message de succès -->
                <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg"></div>

                <!-- Boutons -->
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-200">
                        Enregistrer
                    </button>
                    <button type="button" id="cancelBtn" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold py-3 px-6 rounded-lg shadow-md transition duration-200">
                        Annuler
                    </button>
                </div>
            </form>
